services:
  soakers-pages:
    build:
      context: .
      dockerfile: Dockerfile
    image: soakers-splash-squad:local
    ports:
      - "127.0.0.1:8788:8788"
    env_file:
      - path: .env.docker
        required: false
    environment:
      HOME: /tmp
      WRANGLER_SEND_METRICS: "false"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
